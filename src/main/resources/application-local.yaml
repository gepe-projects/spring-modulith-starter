# Local development defaults only (see agents.md §5).
# PostgreSQL and Redis are provided externally (user-managed containers).
# Override anything here via SPRING_* env vars in real deployments.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/starter-modulith
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: root
