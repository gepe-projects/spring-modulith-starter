spring:
  profiles:
    active:
      - dev
  application:
    name: spring-modulith-starter
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starter-modulith}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
      # Catatan: schema "user" (module user) adalah reserved word Postgres. Quoting-nya
      # ditangani di entity (@Table(schema = "`user`") — backtick Hibernate), karena setting
      # hibernate.auto_quote_keyword sudah dihapus dari Hibernate 7 dan tidak berpengaruh.
  flyway:
    locations:
      - classpath:db/migration
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      username: ${SPRING_DATA_REDIS_USERNAME:root}
      password: ${SPRING_DATA_REDIS_PASSWORD:root}
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    scheduler-name: appScheduler
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    startup-delay: 5s
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.clusterCheckinInterval: "15000"
      org.quartz.jobStore.misfireThreshold: "60000"
      org.quartz.threadPool.threadCount: "5"
  modulith:
    events:
      republish-outstanding-events-on-restart: false
      staleness:
        check-interval: 5m
        published: 10m
        processing: 30m
        resubmitted: 10m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
  tracing:
    # Tracing is intentionally OFF in the starter (see agents.md §7 "Later
    # enablement"). Set to true once a Micrometer tracing bridge / OTLP
    # exporter is added; this also avoids proxying module beans meanwhile.
    enabled: false
