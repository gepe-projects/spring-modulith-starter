# No profile is hard-coded: local defaults live right here behind ${VAR:default}
# placeholders. Optional profiles are additive at runtime, e.g. the logback
# `json` profile: SPRING_PROFILES_ACTIVE=json (see agents.md §7).
spring:
  application:
    name: spring-modulith-starter
  # Graceful shutdown (multi-instance rolling deploys, agents.md §11): on SIGTERM
  # the instance stops taking new requests, lets in-flight requests finish and
  # waits up to the timeout below before closing the context (Quartz jobs wait
  # via wait-for-jobs-to-complete-on-shutdown).
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starter-modulith}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
      # Schema is managed exclusively by Flyway migrations under db/migration.
      # Note: if a module table ever lives in a schema literally named `user`
      # (reserved word in Postgres), the entity needs @Table(schema = "`user`")
      # — Hibernate 7 no longer honors hibernate.auto_quote_keyword. The example
      # `user` module avoids this by using the plural table name `users` in the
      # default schema (V3__create_users_table.sql).
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    # Multi-instance: several instances may boot at the same time (rolling
    # deploys, scale-up). Flyway serializes migrations on PostgreSQL via
    # advisory locks, so concurrent starts are safe (agents.md §11).
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      username: ${SPRING_DATA_REDIS_USERNAME:root}
      password: ${SPRING_DATA_REDIS_PASSWORD:root}
      # Redis is used as the shared CACHE store only — never as Spring Data
      # repositories (no @RedisHash entities). Disabling the repository support
      # silences the "strict repository configuration" startup noise that
      # scanning JPA repositories with Spring Data Redis enabled would cause.
      repositories:
        enabled: false
    # Caching: Redis-backed CacheManager configured once in platform/config
    # (CacheConfig + module CacheSpec beans, agents.md §3/§11.2). The store is
    # shared Redis — never an in-process cache — so every instance serves the
    # same entries. Cache only read paths returning api DTO records; evict
    # explicitly from mutating operations.
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never # QRTZ_* tables come from V2__quartz_tables.sql
    scheduler-name: appScheduler
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    startup-delay: 5s
    properties:
      org.quartz.scheduler.instanceId: AUTO
      # Clustered JDBC store: all instances share one DB, one scheduler name;
      # Quartz guarantees each trigger fires on exactly one instance.
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.clusterCheckinInterval: "15000"
      org.quartz.jobStore.misfireThreshold: "60000"
      # Recommended for PostgreSQL clusters: acquire triggers under the DB lock
      # to avoid duplicate acquisition / deadlocks between instances.
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.threadPool.threadCount: "5"
  modulith:
    events:
      # Crash recovery (multi-instance, agents.md §11): on startup every
      # instance republishes publications that are not COMPLETED (e.g. the
      # instance holding them crashed mid-delivery). Delivery is at-least-once
      # — listeners must be idempotent.
      republish-outstanding-events-on-restart: true
      staleness:
        # Background "staleness monitor": publications stuck in PUBLISHED /
        # PROCESSING / RESUBMITTED longer than the matching duration are marked
        # FAILED so they can be republished (on restart, or via
        # FailedEventPublications.resubmit(...)). All instances share the same
        # event_publication table, so whichever instance runs the monitor first
        # recovers the crash.
        check-interval: 5m
        published: 10m
        processing: 30m
        resubmitted: 10m

# Graceful shutdown: stop accepting new requests first, then let in-flight
# work finish (with spring.lifecycle.timeout-per-shutdown-phase above).
server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
            # Redis is the shared cache store (platform CacheConfig): a lost
            # Redis must take the instance out of load balancer rotation.
            - redis
  tracing:
    # Tracing is intentionally OFF in the starter (see agents.md §7 "Later
    # enablement"). Set to true once a Micrometer tracing bridge / OTLP
    # exporter is added; this also avoids proxying module beans meanwhile.
    enabled: false
